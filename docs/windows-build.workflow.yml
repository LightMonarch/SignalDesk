name: Windows build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - work/SignalDesk/**
      - .github/workflows/windows.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: work/SignalDesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: work/SignalDesk/package-lock.json
      - run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: ./packaging/prepare-sensors.ps1
      - run: npm run build
      - run: npm test
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis,msi
      - name: Verify live telemetry
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'signaldesk-smoke.json'
          $p = Start-Process src-tauri/target/release/signaldesk.exe -ArgumentList @('--self-check', ('"' + $out + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { Get-Content -LiteralPath $out; exit $p.ExitCode }
          Get-Content -LiteralPath $out
      - uses: actions/upload-artifact@v4
        with:
          name: signaldesk-windows-x64
          path: |
            work/SignalDesk/src-tauri/target/release/bundle/nsis/*.exe
            work/SignalDesk/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
