[package]
name = "signaldesk"
version = "1.1.0"
edition = "2021"
description = "Private Windows hardware monitoring and diagnostics"

[build-dependencies]
tauri-build = {version="2",features= [] }

[dependencies]
tauri = {version="2",features= ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = {version="1",features= ["derive"] }
serde_json = "1"
sysinfo = "=0.33.1"
rusqlite = {version="0.32",features= ["bundled"] }
tempfile = "3"
ureq = {version="2.12",default-features=false,features= ["json"] }
rfd = {version="0.15",default-features=false}
winreg = "0.55"
wmi = "=0.18.4"
windows = {version="0.62", features= ["Devices_Power", "Foundation", "Win32_System_WinRT", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-sys = {version="0.59",features= ["Win32_System_Power", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_NetworkManagement_WiFi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Memory", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
